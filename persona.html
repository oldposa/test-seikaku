const KEY='persona_v3_local_1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch{data={}};data={work:{},private:{},love:{},health:{},custom:{work:{},private:{},love:{},health:{}},notes:'',name:'',problem:'',goal:'整理',...data};data.custom={work:{},private:{},love:{},health:{},...(data.custom||{})};data.love=data.love||{};data.health=data.health||{};let page='home',mode='work',idx=0;const app=document.getElementById('app');function save(){localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('status').textContent='この端末に自動保存しました（サーバーには送信しません）'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function count(m){return Array.from({length:SIZE[m]},(_,i)=>i).filter(i=>data[m][i]!==undefined||(data.custom[m][i]||'').trim()).length}function btn(s,fn,cls='secondary'){return `<button class="${cls}" onclick="${fn}">${s}</button>`}function render(){if(page==='home'){app.innerHTML=`<h1>自分を知ってもらう。<br>相談を、もっと自分らしく。</h1><p class="muted">性格に点数をつけるのではなく、あなたの行動の傾向をAIに伝えるためのプロフィールを作ります。</p><div class="card"><h2>どの自分から答える？</h2><p class="muted">好きなモードだけでOK。ほかのモードは後から追加できます。</p>${btn('💼 仕事モード　'+count('work')+'/30 問',"start('work')") }<div style="height:10px"></div>${btn('☕ プライベートモード　'+count('private')+'/30 問',"start('private')")}<div style="height:10px"></div>${btn('💗 恋愛モード　'+count('love')+'/30 問',"start('love')")}<div style="height:10px"></div>${btn('🌿 健康管理モード　'+count('health')+'/30 問',"start('health')")}</div><div class="card"><h2>あなたのプロフィール</h2><p class="note">回答した分だけでも保存・出力できます。</p>${btn('プロフィールを確認・編集',"go('profile')")}</div><div class="card"><h2>悩みをAIに相談する</h2><p class="note">回答と補足をまとめて、ChatGPTやGeminiに貼り付けられます。</p>${btn('相談文を作る',"go('consult')",'primary')}</div><p class="note">回答はこのブラウザ内に保存。共有ボタンを押すまで外部送信しません。端末やブラウザのデータ削除で消える場合があります。</p>`}
