const KEY='persona_v3_local_1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch{data={}};data={work:{},private:{},notes:'',name:'',problem:'',goal:'整理',...data};let page='home',mode='work',idx=0;const app=document.getElementById('app');function save(){localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('status').textContent='この端末に自動保存しました（サーバーには送信しません）'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function count(m){return Object.keys(data[m]).length}function btn(s,fn,cls='secondary'){return `<button class="${cls}" onclick="${fn}">${s}</button>`}function render(){if(page==='home'){app.innerHTML=`<h1>自分を知ってもらう。<br>相談を、もっと自分らしく。</h1><p class="muted">性格に点数をつけるのではなく、あなたの行動の傾向をAIに伝えるためのプロフィールを作ります。</p><div class="card"><h2>まず、どちらの自分から？</h2><p class="muted">片方だけでも完成できます。後からもう片方を追加できます。</p>${btn('💼 仕事モード　'+count('work')+'/30 問',"start('work')") }<div style="height:10px"></div>${btn('☕ プライベートモード　'+count('private')+'/30 問',"start('private')")}</div><div class="card"><h2>あなたのプロフィール</h2><p class="note">回答した分だけでも保存・出力できます。</p>${btn('プロフィールを確認・編集',"go('profile')")}</div><div class="card"><h2>悩みをAIに相談する</h2><p class="note">回答と補足をまとめて、ChatGPTやGeminiに貼り付けられます。</p>${btn('相談文を作る',"go('consult')",'primary')}</div><p class="note">回答はこのブラウザ内に保存。共有ボタンを押すまで外部送信しません。端末やブラウザのデータ削除で消える場合があります。</p>`}
if(page==='quiz'){let qs=mode==='work'?W:P,q=qs[idx],selected=data[mode][idx];app.innerHTML=`<div class="row" style="align-items:center"><span class="tag">${mode==='work'?'仕事':'プライベート'}</span><span class="muted" style="text-align:right">${idx+1} / 30</span></div><div class="bar"><div class="fill" style="width:${(idx+1)/30*100}%"></div></div><div class="card"><h2>${esc(q[0])}</h2><p class="note">普段のあなたに一番近いものを選んでください。どれにも優劣はありません。</p><div class="options">${q.slice(1).map((a,i)=>`<button class="option ${selected===i?'selected':''}" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div><div class="row">${btn('← 戻る',"prev()")}${btn(idx===29?'回答を終える':'次へ →',"next()",'primary')}</div></div>${btn('ホームに戻る（保存済み）',"go('home')")}`}
if(page==='profile'){app.innerHTML=`<h1>あなたのプロフィール</h1><p class="muted">選んだ回答をそのまま記録します。回答から性格を断定したり、点数で優劣をつけたりしません。</p><div class="card"><label for="name">呼ばれたい名前（任意）</label><input id="name" value="${esc(data.name)}" oninput="data.name=this.value;save()" placeholder="ニックネーム"><label for="notes">AIに誤解されたくないこと・自分で補足したいこと</label><textarea id="notes" oninput="data.notes=this.value;save()" placeholder="例：仕事では慎重だけど、休日は思いつきで動く。">${esc(data.notes)}</textarea><p class="note">ここに書いた本人の説明を、AIの推測より優先するよう指示します。</p></div>${['work','private'].map(m=>`<div class="card"><h2>${m==='work'?'仕事':'プライベート'}　${count(m)}/30</h2>${btn('回答する・修正する',`start('${m}')`)}<details><summary style="margin-top:14px;cursor:pointer">回答を確認</summary>${(m==='work'?W:P).map((q,i)=>data[m][i]===undefined?'':`<p class="note"><b>${i+1}. ${esc(q[0])}</b><br>${esc(q[data[m][i]+1])}</p>`).join('')}</details></div>`).join('')}<div class="card">${btn('AIに渡すプロフィールをコピー',"copyProfile()",'primary')}<div style="height:10px"></div>${btn('JSONファイルとして保存',"downloadJSON()")}</div>${btn('相談文を作る →',"go('consult')")}`}

function go(p){page=p;render();scrollTo(0,0)}function start(m){mode=m;idx=Array.from({length:30},(_,i)=>i).find(i=>data[m][i]===undefined)??0;go('quiz')}function answer(i){data[mode][idx]=i;save();render()}function prev(){if(idx>0)idx--;else return go('home');render()}function next(){if(idx<29){idx++;render()}else go('profile');scrollTo(0,0)}function profileText(){let out=`PERSONA v3｜本人の自己紹介\n名前：${data.name||'未入力'}\n\n【本人による補足・訂正（推測より優先）】\n${data.notes||'記入なし'}\n`;for(let [m,qs,label] of [['work',W,'仕事'],['private',P,'プライベート']]){out+=`\n【${label}での回答：${count(m)}/30】\n`;qs.forEach((q,i)=>{if(data[m][i]!==undefined)out+=`Q${i+1} ${q[0]}\n回答：${q[data[m][i]+1]}\n`})}return out}function consultText(){return `以下は私の相談内容と、私が回答したPERSONAプロフィールです。\n\n【今回の相談：最優先】\n${data.problem||'未入力'}\n\n【希望する対応】${data.goal}\n\n【AIへのお願い】\n・今回の相談内容を最優先し、過去の回答は参考情報として扱ってください。\n・本人の補足や訂正を、回答からの推測より優先してください。\n・性格を断定せず、回答していない項目は推測で埋めないでください。\n・必要なら私の考えへの反論、見落とし、別の選択肢も提示してください。\n・追加質問を必須にせず、まず現時点の情報だけで役立つ回答をしてください。\n\n${profileText()}`}async function copy(s){try{await navigator.clipboard.writeText(s);alert('コピーしました！')}catch{prompt('長押ししてコピーしてください',s)}}function copyProfile(){copy(profileText())}function copyConsult(){copy(consultText())}function download(content,name,type='text/plain'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function downloadJSON(){download(JSON.stringify({version:'PERSONA v3 prototype',savedAt:new Date().toISOString(),...data},null,2),'persona-profile.json','application/json')}function downloadConsult(){download(consultText(),'persona-consultation.txt')}render();
</script></body></html>
